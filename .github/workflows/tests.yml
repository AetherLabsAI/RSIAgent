name: Portable tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/check_rsi_release.py
      - run: bash -n scripts/run_rsi.sh
      - name: Check public entrypoints
        run: |
          python run_osworld.py --help
          python run_ale.py --help
          python -m benchmarks.osworld.task --help
          python -m benchmarks.osworld.phase1 --help
          python -m benchmarks.osworld.phase2 --help
          python -m benchmarks.osworld.pipeline --help
          python tools/smoke_osworld.py --help
          python run_osworld.py --dry-run > /tmp/osworld-batch.json
