# Phase 2: outcome-grounded targeted practice.
#
# Actor Agent:      GLM-5.3
# Verifier Agent:   Kimi K3, one persistent context across candidate revisions
# Curriculum Agent: Kimi K3, selects practice after FAIL; the protocol's
#                   phase2.stop_policy controls whether PASS is reviewed too
# Memory:           inherited from Phase 1 and mutable only at learning boundaries
# Official grader:  unavailable to this mode

model: z-ai/glm-5.3
provider_order: [Z.AI]
provider_allow_fallbacks: true
provider_require_parameters: true
max_tokens: 65536
temperature: 1.0
primary_temperature: 1.0
top_p: 1.0
reasoning_effort: "max"
reasoning_max_tokens: 0
reasoning_in_history: true

# Agent-owned completion. These are undisclosed emergency watchdogs, not a
# curriculum/project/turn budget.
agent_decided_stop: true
max_iters: 500
max_nudges: 25
wall_clock_secs: 36000
llm_infra_retry_secs: 30
script_timeout: 600
controller_recovery_secs: 180
controller_recovery_probe_secs: 5.0
controller_recovery_stable_probes: 2
max_resumes: 1
resume_synthesize_worklog: true
action_discipline: true
cycle_evidence: true

# Fully asymmetric stall recovery.
escalation_model: moonshotai/kimi-k3
escalation_agentic_verifier_config: config/roles/verifier_escalation.yaml
escalation_primary_temperature: 1.0
escalation_provider_order: []
escalation_provider_allow_fallbacks: true
escalation_provider_require_parameters: false
escalation_verifier_cross_model: true

# Lossless long-context transport.
trace_head: 0
trace_tail: 0
history_keep_pairs: 80
keep_chars: 500000
ctx_high_water: 900000
ctx_low_water: 500000
fold_batch: 10
worklog_max_chars: 500000

# One Kimi K3 eye per Actor Look; no visual ensemble or judge.
vision_model: moonshotai/kimi-k3
vision_rounds: 1
look_ensemble: 1
look_ensemble_temp: 0.8
vision_max_tokens: 32768
look_max_side: 2560
archive_eyes: false
vision_model_2: ""
split_done_gate: true
done_witness_gates: true

# Local evidence authority remains with the persistent Verifier Agent. There is
# no pre-Actor orientation. Its programs inspect a rollback-protected mirror of
# the real candidate. PASS and FAIL both ground Actor-owned learning; PASS then
# follows the protocol's explicit stopping policy. This Actor configuration
# alone does not select Curriculum review after PASS.
independent_verify: true
verifier_model: moonshotai/kimi-k3
verifier_continuity: true
agentic_verifier_config: config/roles/verifier.yaml
verifier_evolve_route: true
verifier_local_verdict_only: true
verifier_unverified_evidence: true
verifier_failure_starts_evolution: true
verifier_hide_actor_memory: true
verifier_stage_lifecycle: false
verifier_persist_scratch: true
verifier_execution_mode: rollback_mirror
verifier_private_paths:
  - /home/user/work
  - /home/user/.memory
actor_evaluator_isolation: true

# Legacy inspector knobs do not constrain the full Agentic Verifier above.
verifier_elastic_depth: true
budget_conditional_accept: true
verifier_items: true
verifier_appearance_attach: true
appearance_attach_max: 2
verifier_destination_note: true
verifier_max_tokens: 65536
verifier_probes: 6
doubts_block_pass: true

# The runner supplies inherited memory explicitly. No forced read or briefing.
env_memory_dir: ""
