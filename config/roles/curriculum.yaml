# Unified-loop CURRICULUM AGENT.
#
# Kimi K3 owns only the high-level lifecycle decisions: HANDOFF / VERIFY_MORE
# after a local PASS and REVISE / EVOLVE after a local FAIL.  This is a distinct,
# persistent Agent context from the Kimi K3 Verifier Agent; sharing a model does
# not share private conversation, scratch, candidate access, or authority.
