# Unified-loop ACTOR AGENT for practice projects.
#
# The target and practice seats use the same GLM-5.3 Actor identity so durable
# memory is learned by the model that must transfer it back to the target. Numeric
# limits are emergency watchdogs, not semantic stopping criteria.
model: z-ai/glm-5.3
provider_order:
  - Z.AI
provider_allow_fallbacks: true
provider_require_parameters: true
vision_model: moonshotai/kimi-k3
vision_rounds: 1
look_ensemble: 1
look_ensemble_temp: 0.8
split_done_gate: true
max_tokens: 65536
reasoning_effort: "max"
reasoning_max_tokens: 0
reasoning_in_history: true
temperature: 1.0
primary_temperature: 1.0
top_p: 1.0
agent_decided_stop: true
max_iters: 2000
max_nudges: 25
wall_clock_secs: 86400
practice_stall_iters: 0
history_keep_pairs: 0
keep_chars: 0
verifier_model: ""
ctx_high_water: 0
ctx_low_water: 0
doubts_block_pass: true
look_max_side: 2560
archive_eyes: false
vision_model_2: ""
vision_max_tokens: 32768
practice_mode: true
independent_verify: false
escalation_model: ""
max_resumes: 0
action_discipline: true
cycle_evidence: true
commit_frac: 1.0
